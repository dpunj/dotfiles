model:
  default: claude-opus-4-6
  provider: anthropic
toolsets:
- hermes-cli
agent:
  max_turns: 60
  tool_use_enforcement: auto
  reasoning_effort: medium
terminal:
  backend: local
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  summary_model: google/gemini-3-flash-preview
  summary_provider: auto
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
  default_toolsets:
  - terminal
  - file
  - web
skills:
  external_dirs:
  - ~/dotfiles/skills
display:
  compact: false
  personality: ''
  streaming: true
  tool_progress: all
security:
  redact_secrets: true
  tirith_enabled: true
platform_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - cronjob
  - delegation
  - file
  - image_gen
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - vision
  - web
